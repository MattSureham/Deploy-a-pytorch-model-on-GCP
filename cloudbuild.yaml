# GCP Cloud Build configuration for YOLOv5 Object Detection API

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/yolov5-api:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/yolov5-api:latest'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/yolov5-api:$SHORT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'yolov5-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/yolov5-api:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'              # YOLOv5 needs more memory
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '40'               # Lower concurrency for ML workloads
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/yolov5-api:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/yolov5-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'  # Faster builds
