# GCP Cloud Build configuration
# This file configures Google Cloud Build for CI/CD

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mnist-classifier:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mnist-classifier:latest'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/mnist-classifier:$SHORT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'mnist-classifier'
      - '--image'
      - 'gcr.io/$PROJECT_ID/mnist-classifier:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/mnist-classifier:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/mnist-classifier:latest'

options:
  logging: CLOUD_LOGGING_ONLY
